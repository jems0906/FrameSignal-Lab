name: Reproducible workbench
on: [push, pull_request]
jobs:
  scientific-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m ruff check backend packages metricsteward/backend
      - run: python -m pip wheel --no-deps ./packages/framesignal-metrics --wheel-dir dist
      - run: python backend/run_analysis.py
      - run: python backend/run_calibration_followup.py
      - run: python backend/run_calibration_grid_followup.py
      - run: python backend/run_calibration_exact_followup.py
      - run: python backend/run_observational_extension.py
      - run: python backend/run_observational_replication.py
      - run: python backend/run_learned_proxy.py
      - run: python backend/export_metricsteward.py
      - run: python -m pytest -q
      - run: python backend/execute_notebooks.py
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-evidence
          path: |
            reports/latest.json
            reports/calibration_followup.json
            reports/calibration_grid_followup.json
            reports/calibration_exact_followup.json
            reports/observational_extension.json
            reports/observational_replication.json
            reports/learned_proxy_extension.json
            reports/metricsteward_handoff.json
            reports/cve-report-1.json
            reports/cve-report-2.json
            reports/final-cve-report.json
            dist/*.whl
            docs/cve-fix-summary.md
            docs/calibration_followup_report.md
            docs/calibration_grid_followup_report.md
            docs/calibration_exact_followup_report.md
            docs/observational_extension_report.md
            docs/observational_replication_report.md
            docs/learned_proxy_report.md
            configs/calibration_followup.json
            configs/calibration_grid_followup.json
            configs/calibration_exact_followup.json
            configs/observational_extension.json
            configs/observational_replication.json
            configs/learned_proxy_extension.json
            docs/validation_report.md
            docs/executive_memo.md
            notebooks/*.ipynb
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  metricsteward-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: metricsteward/frontend/package-lock.json
      - run: npm ci
        working-directory: metricsteward/frontend
      - run: npm audit
        working-directory: metricsteward/frontend
      - run: npm run build
        working-directory: metricsteward/frontend