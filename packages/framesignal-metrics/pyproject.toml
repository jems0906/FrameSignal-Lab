[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framesignal-metrics"
version = "1.0.0"
description = "Shared household-level educational measurement calculations for FrameSignal and MetricSteward consumers"
requires-python = ">=3.11"
dependencies = ["pandas==2.2.3"]

[tool.setuptools.packages.find]
where = ["src"]