services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend:
        condition: "service_healthy"
  metricsteward-backend:
    build:
      context: .
      dockerfile: metricsteward/backend/Dockerfile
    ports: ["127.0.0.1:8001:8001"]
    volumes: ["metricsteward-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/steward/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
  metricsteward-frontend:
    build:
      context: .
      dockerfile: metricsteward/frontend/Dockerfile
    ports: ["127.0.0.1:8082:80"]
    depends_on:
      metricsteward-backend:
        condition: "service_healthy"

volumes:
  metricsteward-data: